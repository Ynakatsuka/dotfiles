name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly staleness sweep (Sat 06:00 JST) so rot is caught even
    # without new commits.
    - cron: "0 21 * * 5"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: jdx/mise-action@v4
        with:
          install: false
          export_path: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh
          mkdir -p "$HOME/.local/bin"
          curl -fsLS https://get.chezmoi.io -o "$RUNNER_TEMP/chezmoi-install.sh"
          sh "$RUNNER_TEMP/chezmoi-install.sh" -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Detect stale repo content
        run: bash scripts/check-stale.sh
      - name: Run repository tests
        run: bash scripts/test.sh

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh for syntax hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Run pre-commit hooks on all files
        run: pipx run pre-commit run --all-files --show-diff-on-failure
